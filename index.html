<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>I dont like saying goodbye, so select your Name for a farewell message</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255,255,255,0.9),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(255,210,160,0.55),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #fff8ed,
          #fff0dc
        );

      color: #3d3028;
      font-family: "DM Sans", sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;

      overflow-x: hidden;
    }


    /* Floating hearts */

    .heart {
      position: fixed;

      color: rgba(213, 132, 66, 0.18);

      font-size: 25px;

      animation:
        float 8s infinite ease-in-out;

      pointer-events: none;

      z-index: 0;
    }

    .heart:nth-child(1) {
      left: 8%;
      top: 15%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 88%;
      top: 20%;
      animation-delay: 2s;
    }

    .heart:nth-child(3) {
      left: 15%;
      bottom: 15%;
      animation-delay: 4s;
    }

    .heart:nth-child(4) {
      right: 12%;
      bottom: 12%;
      animation-delay: 1s;
    }


    @keyframes float {
      0%, 100% {
        transform:
          translateY(0)
          rotate(0deg);
      }

      50% {
        transform:
          translateY(-25px)
          rotate(8deg);
      }
    }


    .container {
      position: relative;

      z-index: 1;

      width: 100%;

      max-width: 720px;

      text-align: center;
    }


    /* Logo */

    .logo-wrapper {
      width: 180px;

      height: 105px;

      margin: 0 auto 8px;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      border-radius: 20px;
    }


    .logo {
      width: 100%;

      height: 100%;

      object-fit: contain;

      /*
        Your uploaded drawing has a white background.
        Multiply makes the white blend nicely
        with the orange page.
      */

      mix-blend-mode: multiply;

      filter:
        contrast(1.08)
        brightness(0.98);
    }


    /* Introduction */

    .intro {
      margin-bottom: 28px;
    }


    .small-title {
      font-size: 13px;

      letter-spacing: 4px;

      text-transform: uppercase;

      color: #c47a32;

      font-weight: 700;

      margin-bottom: 12px;
    }


    h1 {
      font-family:
        "Playfair Display",
        serif;

      font-size:
        clamp(40px, 8vw, 70px);

      line-height: 1;

      margin: 0;

      color: #3d2d24;
    }


    .subtitle {
      margin-top: 18px;

      color: #806f62;

      font-size: 16px;
    }


    /* Main card */

    .card {
      background:
        rgba(255, 252, 247, 0.82);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      border:
        1px solid rgba(255,255,255,0.9);

      border-radius: 28px;

      padding: 35px;

      box-shadow:
        0 20px 60px
        rgba(110, 68, 30, 0.13),

        0 4px 15px
        rgba(110, 68, 30, 0.06);
    }


    label {
      display: block;

      font-size: 14px;

      font-weight: 700;

      color: #65554a;

      margin-bottom: 10px;

      text-align: left;
    }


    /* Dropdown */

    select {
      width: 100%;

      padding: 16px 18px;

      border:
        2px solid #ecd9c2;

      border-radius: 15px;

      background: #fffdfa;

      color: #40352f;

      font-family: inherit;

      font-size: 16px;

      outline: none;

      cursor: pointer;

      transition: 0.25s ease;

      appearance: auto;
    }


    select:focus {
      border-color: #dc974f;

      box-shadow:
        0 0 0 4px
        rgba(220,151,79,0.13);
    }


    /* Main button */

    button {
      width: 100%;

      margin-top: 14px;

      padding: 16px;

      border: none;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #e3a15c,
          #d4873d
        );

      color: white;

      font-family: inherit;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 8px 20px
        rgba(190,116,49,0.25);

      transition: 0.25s ease;
    }


    button:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 12px 25px
        rgba(190,116,49,0.30);
    }


    button:active {
      transform:
        translateY(0);
    }


    /* Message box */

    #messageBox {
      display: none;

      margin-top: 25px;

      text-align: left;

      animation:
        reveal 0.7s ease forwards;
    }


    @keyframes reveal {

      from {
        opacity: 0;

        transform:
          translateY(20px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    .message-card {
      background: #fffdfa;

      border-radius: 22px;

      padding: 30px;

      border:
        1px solid #efdfcd;

      position: relative;

      overflow: hidden;
    }


    .message-card::before {
      content: "“";

      position: absolute;

      top: -25px;

      left: 12px;

      font-family:
        Georgia, serif;

      font-size: 130px;

      color:
        rgba(216,139,80,0.10);

      line-height: 1;
    }


    .message-to {
      position: relative;

      font-family:
        "Playfair Display",
        serif;

      font-size: 28px;

      color: #c47535;

      margin-bottom: 20px;
    }


    .message-text {
      position: relative;

      font-size: 16px;

      line-height: 1.8;

      color: #51463e;

      white-space: pre-line;
    }


    /* Reset button */

    .reset {
      background: transparent;

      color: #c47535;

      box-shadow: none;

      border:
        1px solid #e8c9a8;

      margin-top: 15px;
    }


    .reset:hover {
      background:
        #fff8ee;

      box-shadow: none;
    }


    /* Footer */

    .footer {
      margin-top: 20px;

      font-size: 12px;

      color: #a39182;
    }


    /* Confetti */

    .confetti {
      position: fixed;

      width: 8px;

      height: 12px;

      top: -20px;

      z-index: 10;

      animation:
        confettiFall 3s linear forwards;

      pointer-events: none;
    }


    @keyframes confettiFall {

      to {
        transform:
          translateY(110vh)
          rotate(720deg);

        opacity: 0;
      }

    }


    /* Mobile */

    @media (max-width: 600px) {

      body {
        padding: 16px;
      }


      .logo-wrapper {
        width: 150px;

        height: 90px;
      }


      .card {
        padding: 23px;

        border-radius: 22px;
      }


      .message-card {
        padding: 23px;
      }


      .message-to {
        font-size: 25px;
      }


      .message-text {
        font-size: 15px;
      }

    }

  </style>
</head>


<body>

    <div class="footer">
      Made with memories & a little bit of chaos ♡

  </main>

    function showMessage() {


      const selectedName =
        document.getElementById("nameSelect").value;


      if (!selectedName) {

        alert("Choose your name first! 😭");

        return;

      }


      document.getElementById("messageName").textContent =
        `Dear ${selectedName},`;


      document.getElementById("messageText").textContent =
        messages[selectedName];


      document.getElementById("messageBox").style.display =
        "block";


      createConfetti();


      setTimeout(() => {


        document
          .getElementById("messageBox")
          .scrollIntoView({

            behavior: "smooth",

            block: "center"

          });


      }, 100);

    }


    function resetMessage() {


      document.getElementById("messageBox").style.display =
        "none";


      document.getElementById("nameSelect").value =
        "";


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }


    function createConfetti() {


      const colors = [

        "#e3a15c",

        "#d4873d",

        "#f0bd83",

        "#f5d6ad",

        "#c98b58",

        "#e9a86d"

      ];


      for (let i = 0; i < 35; i++) {


        const confetti =
          document.createElement("div");


        confetti.className =
          "confetti";


        confetti.style.left =
          Math.random() * 100 + "vw";


        confetti.style.background =
          colors[
            Math.floor(
              Math.random() * colors.length
            )
          ];


        confetti.style.animationDelay =
          Math.random() * 0.8 + "s";


        confetti.style.transform =
          `rotate(${Math.random() * 360}deg)`;


        document.body.appendChild(confetti);


        setTimeout(() => {

          confetti.remove();

        }, 4000);

      }

    }


    document
      .getElementById("nameSelect")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            showMessage();

          }

        }
      );


  </script>
